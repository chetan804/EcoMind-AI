[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecomind-backend"
version = "0.1.0"
description = "EcoMind AI backend: FastAPI modular monolith exposing the /api/v1 REST API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.143,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "pyjwt>=2.8,<3",
  "email-validator>=2.1,<3",
  "pillow>=11,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx2>=2,<3",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "integration: needs a real PostgreSQL server (TEST_DATABASE_URL); uses an isolated, throw-away database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608", "E501"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations", "tests"]
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
