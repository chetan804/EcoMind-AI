# Serves the static single-page app. API calls go to VITE_API_BASE_URL (baked in at build time).
#
# nginx does not inherit `add_header` into a location that sets its own, so the security headers are
# repeated in every location below. Keep the two blocks identical.
#
# Content-Security-Policy: the SPA loads only its own scripts, fonts and styles, shows images from
# itself, `data:` and `blob:` (authenticated photos, QR code) and calls its API with fetch.
# `style-src 'unsafe-inline'` is needed for React `style` attributes; there is no inline script and no
# eval (zod runs in `jitless` mode, see frontend/src/app/zod-config.ts). `connect-src` allows any https
# origin because the API origin is a build-time choice this file cannot know: NARROW IT to your API
# origin (for example `connect-src 'self' https://api.example.org`) when you deploy. The policy was
# exercised against a production build in a real browser with no violations (docs/security/security-review.md).
#
# Built-in offline map (the default): MapLibre runs in a blob: web worker (worker-src) and reads its tiles
# from this same origin at /map-assets/tiles/region.pmtiles with HTTP Range requests, which nginx serves
# for static files. The file is NOT in the image: mount it read-only (docs/maps/OFFLINE_MAPS.md):
#   -v ./deployment/map-data:/usr/share/nginx/html/map-assets/tiles:ro
# It must be readable by the unprivileged nginx user (uid 101). Fonts and sprites ship in the image.
#
# Google Maps (optional provider): the Maps JavaScript API is loaded from https://maps.googleapis.com, so script, image,
# font, worker and frame sources for Google's documented hosts are allowed (list taken from Google's
# CSP guide). Google's own sample also lists 'unsafe-eval' in script-src; it is deliberately NOT
# allowed here. It has not been verified against a live key whether the current API needs it: check
# the browser console on the first deployment with a key (docs/maps/GOOGLE_MAPS_INTEGRATION.md),
# and widen the policy only if a violation is reported. If maps fail to load, the screens show their
# labelled list fallback instead of a blank map.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com https://*.ggpht.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:; worker-src 'self' blob:; frame-src https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com https://*.ggpht.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:; worker-src 'self' blob:; frame-src https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # Basemap fonts and sprites (in the image) and the optional tile file (mounted volume).
  location /map-assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com https://*.ggpht.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:; worker-src 'self' blob:; frame-src https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
