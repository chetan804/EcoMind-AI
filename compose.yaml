# Local development stack: PostgreSQL -> migrations -> backend -> frontend.
# Startup order is enforced with health checks (see docs/operations/runbook.md).
# Not a production deployment: see docs/architecture/deployment-architecture.md.
name: ecomind-ai

x-backend-environment: &backend-environment
  ENVIRONMENT: local
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  FILE_STORAGE_LOCAL_PATH: /var/lib/ecomind/storage
  MODEL_ARTIFACTS_DIR: /var/lib/ecomind/artifacts
  # Optional road routing (none | google | osrm); empty = google when a key is set, else none.
  ROUTING_PROVIDER: ${ROUTING_PROVIDER:-}
  OSRM_BASE_URL: ${OSRM_BASE_URL:-}
  OSRM_TIMEOUT_SECONDS: ${OSRM_TIMEOUT_SECONDS:-8}
  # Account e-mail. Empty EMAIL_BACKEND = console in this local stack: messages (with their links)
  # appear in `docker compose logs backend`. APP_BASE_URL must be the address you open in the browser.
  EMAIL_BACKEND: ${EMAIL_BACKEND:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
  # Registrations per client address per hour; the CI end-to-end run raises it (see quality-gates.yml).
  REGISTRATION_LIMIT_PER_IP_PER_HOUR: ${REGISTRATION_LIMIT_PER_IP_PER_HOUR:-10}
  ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-90}
  # Blank = default policy (administrator and manager in production); see .env.example.
  MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-}
  # Optional, server-only (Routes API). Empty = road routes reported as unavailable.
  GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY:-}

x-backend-build: &backend-build
  context: .
  dockerfile: deployment/docker/backend.Dockerfile

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ecomind_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ecomind-backend:dev
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: ecomind-backend:dev
    build: *backend-build
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *backend-environment
    volumes:
      - ./backend/app:/srv/backend/app
      - ecomind_storage:/var/lib/ecomind/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/frontend.Dockerfile
      target: dev
    environment:
      DEV_PROXY_TARGET: http://backend:8000
      DEV_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
      VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
      VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-}
      VITE_MAP_TILES_URL: ${VITE_MAP_TILES_URL:-}
      MAP_DATA_DIR: /map-data
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./deployment/map-data:/map-data:ro
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

  # Optional demonstration mail catcher (profile `demo-mail`, started by `make demo-mail-up`).
  # Accepts what the backend sends and shows it at http://localhost:8025; nothing leaves the host.
  # Credentials come from the git-ignored .env.demo-mail (scripts/setup/init_demo_mail.py).
  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: ["demo-mail"]
    environment:
      MP_SMTP_AUTH: ${MAILPIT_SMTP_AUTH:-}
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"  # no TLS inside the private compose network (local only)
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      # The image is minimal (no curl/wget); Mailpit ships its own readiness probe.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Optional road routing (OpenStreetMap data you prepared with scripts/maps/build_region_data.py routing).
  # Start with `docker compose --profile osrm up -d osrm`, then set ROUTING_PROVIDER=osrm and
  # OSRM_BASE_URL=http://osrm:5000 in .env. Not exposed to the host: only the backend talks to it.
  # Not run in CI or by the author (no Docker in the build environment); see docs/maps/HYDERABAD_DATA_RUNBOOK.md.
  osrm:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:latest}
    profiles: ["osrm"]
    command: ["osrm-routed", "--algorithm", "mld", "/data/region.osrm"]
    volumes:
      - ./deployment/osrm-data:/data:ro
    restart: unless-stopped

volumes:
  ecomind_pgdata:
  ecomind_storage:
