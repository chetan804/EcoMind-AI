name: Quality gates

# Repository-wide checks and the cross-application tests (ML, contract, containers, end-to-end).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: Structure, templates and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Canonical structure
        run: python scripts/quality/check_structure.py
      - name: Environment templates contain no secrets
        run: python scripts/quality/check_env_templates.py
      - name: Docker Compose configuration is valid
        run: docker compose --env-file .env.example config --quiet

  ml:
    name: ML tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-dev.txt
      - run: pip install -r ml/requirements-dev.txt
      - name: Lint (ruff check)
        working-directory: ml
        run: ruff check .
      - name: Format (ruff format --check)
        working-directory: ml
        run: ruff format --check .
      - name: Types (mypy)
        working-directory: ml
        shell: bash
        run: |
          # TEMPORARY DIAGNOSTIC: surface mypy output as annotations (job logs are not retrievable by API clients)
          python --version
          mypy > /tmp/mypy.txt 2>&1 && rc=0 || rc=$?
          { python --version; pip list 2>/dev/null | grep -i -E "^(numpy|scikit-learn|mypy|ai-edge-litert|pillow|pyyaml) "; head -40 /tmp/mypy.txt; } | while IFS= read -r line; do echo "::error::${line}"; done
          exit $rc
      - name: Tests (pytest)
        working-directory: ml
        run: pytest

  contract:
    name: Contract tests and generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: pytest tests/contract
      - name: Data dictionary matches the models
        run: python scripts/database/generate_data_dictionary.py --check

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Backend image
        run: docker build -f deployment/docker/backend.Dockerfile -t ecomind-backend .
      - name: Frontend production image
        run: docker build -f deployment/docker/frontend.Dockerfile --target production -t ecomind-frontend .

  e2e:
    name: End-to-end (Compose stack + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with generated secrets
        run: python scripts/setup/init_env.py
      - name: Start stack (db -> migrate -> backend -> frontend)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: python tests/smoke/smoke.py --api http://localhost:8000 --web http://localhost:5173 --wait 60
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright tests
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down
