name: Quality gates

# Repository-wide checks and the cross-application tests (ML, contract, containers, end-to-end).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: Structure, templates and Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Canonical structure
        run: python scripts/quality/check_structure.py
      - name: Environment templates contain no secrets
        run: python scripts/quality/check_env_templates.py
      - name: Design tokens meet WCAG contrast
        run: python scripts/quality/check_contrast.py
      - name: Python lock files match pyproject.toml / requirements-dev.txt
        run: |
          python -m pip install "uv==0.13.4"
          scripts/dependencies/lock_backend.sh --check
      - name: Docker Compose configuration is valid
        run: docker compose --env-file .env.example config --quiet
      - name: Docker Compose configuration is valid with the Mailpit and OSRM profiles
        run: |
          python scripts/setup/init_demo_mail.py
          docker compose --env-file .env.example --env-file .env.demo-mail --profile demo-mail --profile osrm config --quiet

  ml:
    name: ML tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-dev.lock
      - name: Install pinned dependencies (hash-verified lock file)
        run: pip install --require-hashes -r ml/requirements-dev.lock
      - name: Lint (ruff check)
        working-directory: ml
        run: ruff check .
      - name: Format (ruff format --check)
        working-directory: ml
        run: ruff format --check .
      - name: Types (mypy)
        working-directory: ml
        run: mypy
      - name: Tests (pytest)
        working-directory: ml
        run: pytest

  contract:
    name: Contract tests and generated docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install pinned dependencies (hash-verified lock file)
        run: |
          pip install --require-hashes -r backend/requirements-dev.lock
          pip install --no-deps -e backend
      - name: Install the map-conversion dependency (hash-verified)
        run: pip install --require-hashes -r scripts/maps/requirements.lock
      - run: pytest tests/contract
      - name: Data dictionary matches the models
        run: python scripts/database/generate_data_dictionary.py --check
      - name: ER diagram matches the models
        run: python scripts/database/generate_er_diagram.py --check
      - name: Route permission matrix matches the app
        run: python scripts/security/generate_route_matrix.py --check

  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Backend image
        run: docker build -f deployment/docker/backend.Dockerfile -t ecomind-backend .
      - name: Frontend production image
        run: docker build -f deployment/docker/frontend.Dockerfile --target production -t ecomind-frontend .

  e2e:
    name: End-to-end (Compose stack + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create .env with generated secrets
        run: |
          python scripts/setup/init_env.py
          # The suite registers a dozen throw-away accounts (more on a retry) from one address, which
          # the production limit of 10 per hour refuses. Only this disposable stack is relaxed.
          printf "\nREGISTRATION_LIMIT_PER_IP_PER_HOUR=200\n" >> .env
      - name: Create demo mail credentials (Mailpit catcher)
        # The backend delivers every e-mail to the Mailpit container over real SMTP with AUTH, and the
        # browser suite reads the one-time links back out of Mailpit's inbox API.
        run: python scripts/setup/init_demo_mail.py
      - name: Start stack (db -> migrate -> backend -> frontend, plus Mailpit)
        run: docker compose --env-file .env --env-file .env.demo-mail --profile demo-mail up -d --build --wait --wait-timeout 300
      - name: Mailpit answers on its API
        # Delivery itself is proven by the account-recovery spec: it asserts that each message sits
        # in this inbox and was sent by an SMTP-authenticated client (the console backend cannot do that).
        run: curl -fsS http://localhost:8025/api/v1/info
      - name: Smoke test
        run: python tests/smoke/smoke.py --api http://localhost:8000 --web http://localhost:5173 --wait 60
      - name: Load the starter help articles for the support spec
        run: docker compose --env-file .env --env-file .env.demo-mail --profile demo-mail exec -T backend python -m app.cli seed-support-knowledge
      - name: Create a throw-away administrator for the core-workflow spec
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$password"
          docker compose --env-file .env --env-file .env.demo-mail --profile demo-mail exec -T -e ECOMIND_ADMIN_PASSWORD="$password" backend \
            python -m app.cli create-admin --email e2e.admin@example.org --name "E2E Administrator"
          echo "E2E_ADMIN_EMAIL=e2e.admin@example.org" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright tests
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: http://localhost:5173
          # The account-recovery spec reads the e-mailed one-time links from the Mailpit inbox
          # (real SMTP delivery from the backend), not from the backend log.
          E2E_MAILPIT_URL: http://localhost:8025
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
      - name: Compose logs
        if: failure()
        run: docker compose --env-file .env --env-file .env.demo-mail --profile demo-mail logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env --env-file .env.demo-mail --profile demo-mail down
