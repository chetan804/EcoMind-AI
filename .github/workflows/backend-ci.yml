name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-types:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: ruff check
        working-directory: backend
        run: ruff check .
      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .
      - name: mypy
        working-directory: backend
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }}, PostgreSQL 16)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throw-away credentials for an ephemeral CI service container.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Server URL for the isolated-database fixture: each test creates and drops its own database.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: pytest (unit, API, security, database integration)
        working-directory: backend
        run: pytest
      - name: Migrations apply cleanly and models match them (alembic upgrade / check)
        working-directory: backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-only-secret-key-0123456789abcdef
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecomind_ci_migration
        run: |
          python - <<'PY'
          import os, sqlalchemy as sa
          url = sa.make_url(os.environ["DATABASE_URL"])
          engine = sa.create_engine(url.set(database="postgres"), isolation_level="AUTOCOMMIT")
          with engine.connect() as c:
              c.execute(sa.text(f'CREATE DATABASE "{url.database}"'))
          PY
          alembic upgrade head
          alembic check
