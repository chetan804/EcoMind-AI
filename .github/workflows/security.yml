name: Security

# Dependency vulnerability audits and static analysis. A finding at or above the thresholds in
# scripts/security/run_audits.sh fails the run. The weekly schedule catches advisories published
# after the last change, so a clean merge does not stay "clean" forever unnoticed.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python dependencies (pip-audit) and bandit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: python -m pip install "pip-audit==2.10.1" "bandit==1.9.4"
      - name: pip-audit (backend and ML lock files)
        run: scripts/security/run_audits.sh python
      - name: bandit (backend application code, medium severity and above)
        run: scripts/security/run_audits.sh bandit

  node:
    name: Node dependencies (npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: npm audit (frontend and end-to-end tests, high and critical)
        run: scripts/security/run_audits.sh node
