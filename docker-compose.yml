version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ecomind-db
    environment:
      POSTGRES_DB: ecomind_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecomind_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: ecomind-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecomind_ai
      SECRET_KEY: change-me-to-a-long-random-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ENVIRONMENT: production
      APP_VERSION: 1.0.0
      CORS_ORIGINS: http://localhost:80,http://localhost:5173
      AI_PROVIDER: fallback
      AI_MODEL: configured-locally
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ecomind-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
