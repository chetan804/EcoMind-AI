# Tool configuration only: `ml` is a code directory, not an installable package.
# Dependencies are in requirements.txt (runtime) and requirements-dev.txt (tests and linters).
# scikit-learn and/or PyTorch are added to requirements.txt by the first capability that needs them.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Orchestration script that assembles large report dictionaries; long literals are intentional.
"waste_classification/training/train.py" = ["E501"]
"waste_classification/evaluation/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["common", "tests"]

# Libraries without type information (no py.typed / stubs published for them).
[[tool.mypy.overrides]]
module = ["sklearn.*", "ai_edge_litert.*", "yaml"]
ignore_missing_imports = true
